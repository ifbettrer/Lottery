<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>抽奖</title>
  <link rel="stylesheet" href="/static/styles.css">
</head>
<body>
  <main>
    <nav class="home-nav" aria-label="抽奖页面导航">
      <a href="/home/join">参与抽奖</a>
      <a class="active" href="/home/draw">抽奖</a>
    </nav>
    <section>
      <h1>抽奖</h1>
      <div class="row">
        <button id="draw-button" type="button">开始抽奖</button>
        <a class="button" href="/api/export?format=csv">导出中奖记录</a>
        <button id="reset-button" class="danger" type="button">重置活动</button>
      </div>
      <div class="draw-display" aria-hidden="true">
        <div id="rolling-number" class="rolling-number">--</div>
        <div id="rolling-name" class="rolling-name">等待抽奖</div>
      </div>
      <div id="result" class="result" aria-live="polite"></div>
    </section>
  </main>
  <script src="/static/draw.js"></script>
</body>
</html>
